name: Deploy app status to EAS Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: eas-hosting-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keep public mirrors in lockstep with the root sources of truth so
      # static fallbacks and the API routes always agree.
      - name: Sync public mirrors
        run: |
          cp status.json public/status.json
          cp status.preview.json public/status.preview.json

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Export web
        run: npx expo export --platform web

      - name: Deploy to EAS Hosting (production)
        run: eas deploy --prod --non-interactive
