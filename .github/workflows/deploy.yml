name: Deploy app status to EAS Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: eas-hosting-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keep public/status.json in lockstep with the root source of truth so
      # static fallbacks (/status.json) and the API route always agree.
      - name: Sync public mirror
        run: cp status.json public/status.json

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Export web
        run: npx expo export --platform web

      - name: Deploy to EAS Hosting (production)
        run: eas deploy --prod --non-interactive
