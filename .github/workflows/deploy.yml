name: Deploy app status to EAS Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: eas-hosting-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Missing GitHub Actions secret EXPO_TOKEN."
            echo "Create an Expo access token: https://expo.dev/settings/access-tokens"
            echo "Then add it as a repository secret named EXPO_TOKEN on Jiggle-Wallet/jiggle-app-status."
            exit 1
          fi

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Export web
        run: npm run export

      - name: Deploy to EAS Hosting (production)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli deploy --prod --non-interactive
